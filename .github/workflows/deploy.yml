name: Deploy React App to AWS test

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 17.9.0

      - name: Install dependencies
        run: npm install

      # ── ESLint — errors only (matches deploy.sh check_eslint) ─────────────────
      - name: ESLint check
        run: |
          npx eslint src --ext .js,.jsx --quiet \
            --ignore-pattern 'src/**/__tests__/**' \
            --ignore-pattern 'src/**/*.test.js' \
            --ignore-pattern 'src/**/*.test.jsx'

      # ── Tests (matches deploy.sh run_tests) ───────────────────────────────────
      - name: Run tests
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" CI=true npm test -- \
            --watchAll=false --runInBand \
            --testPathIgnorePatterns="RFQReceived.smoke|importHandlers|QuotationCreate.productEditFocus"

      # ── Build — abort on "Compiled with warnings" (matches deploy.sh gate) ────
      - name: Build
        run: |
          NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" \
          DANGEROUSLY_DISABLE_HOST_CHECK=true \
          REACT_APP_API_URL=https://startpos-api-test.startuptech.uk \
          GENERATE_SOURCEMAP=false \
          DISABLE_ESLINT_PLUGIN=true \
          npm run build 2>&1 | tee /tmp/build.log
          if grep -qi "compiled with warnings" /tmp/build.log; then
            echo "Build produced warnings — aborting (matches deploy.sh gate)."
            exit 1
          fi

      # ── Time window: only deploy test between 10 PM and 6 AM Saudi time ───────
      # Matches deploy.sh: Saudi Arabia is UTC+3; allowed hours are 22-23, 0-5.
      - name: Check test-deploy window (10 PM – 6 AM Saudi time)
        id: window
        run: |
          SA_HOUR=$(TZ='Asia/Riyadh' date +%H)
          SA_HOUR=$((10#$SA_HOUR))
          SA_TIME=$(TZ='Asia/Riyadh' date '+%H:%M')
          if [ "$SA_HOUR" -ge 6 ] && [ "$SA_HOUR" -lt 22 ]; then
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "Outside test deploy window (current Saudi time: $SA_TIME). Deploy skipped."
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "Within test deploy window ($SA_TIME Saudi time). Proceeding with deploy."
          fi

      # ── Deploy: rsync to staging dir, then atomic swap (near-zero downtime) ───
      - name: Deploy to AWS (atomic swap)
        if: steps.window.outputs.in_window == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets.AWS_DEST_PATH }}
        run: |
          set -e
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem -p $AWS_PORT"
          DEST="${AWS_DEST_PATH%/}"   # strip trailing slash
          TMP="${DEST}_new"
          OLD="${DEST}_old"

          # Ensure both directories exist on the server
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" "mkdir -p $TMP $DEST"

          # Step 1: rsync into staging dir — live site untouched during transfer
          rsync -az --partial --timeout=60 \
            -e "ssh $SSH_OPTS" \
            build/ "$AWS_USER@$AWS_HOST:$TMP/"

          # Step 2: atomic swap — two renames on same filesystem (~1 ms total)
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" \
            "mv $DEST $OLD && mv $TMP $DEST && rm -rf $OLD"

          rm -f private_key.pem
          echo "Test deploy complete."
