name: Test and deploy React App (test, then production)

# One pipeline for both sites. master and test carry the same code, so a push
# to master runs every suite once and builds once; that exact build goes to the
# test site and, only after the test site serves it, to production. The API
# host is worked out at runtime from the page's host (src/utils/apiBaseURL.js),
# so the same build is right for both. There is no test branch: master is the
# only branch that deploys.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # ESLint, Jest, build (no warnings), mocked-API browser e2e and full-stack
  # browser e2e against the API's master. Nothing is deployed unless every
  # one of them passes.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      backend_ref: master

  # ── Test site first ─────────────────────────────────────────────────────────
  deploy-test:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (deploy script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # The exact build the tests ran against.
      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      # rsync to a staging dir, atomic swap (two renames, ~1 ms), then check
      # the site serves this build's index.html; if not, swap the previous
      # build back and fail, which keeps production on its current build.
      - name: Deploy to the test site (atomic swap, verified)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets.AWS_DEST_PATH }}
          SITE_URL: https://test.gulfunionozone.com/
        run: bash .github/scripts/deploy_site.sh

  # ── Production: the same build, only after the test site serves it ────────
  # If this job fails the previous production build is swapped back;
  # "Re-run failed jobs" redeploys this same build without re-running tests.
  deploy-production:
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (deploy script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: Deploy to the production site (atomic swap, verified)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets.AWS_DEST_PATH_PROD }}
          SITE_URL: https://startpos.gulfunionozone.com/
        run: bash .github/scripts/deploy_site.sh
