name: Deploy React App to AWS production

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time per environment; a newer push waits instead of racing.
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  # ESLint, Jest, build (no warnings), mocked-API browser e2e and full-stack
  # browser e2e against the production API branch. Nothing is deployed unless
  # every one of them passes.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      api_url: https://startpos-api.gulfunionozone.com
      backend_ref: master

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      # The exact build the tests ran against.
      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      # ── Deploy: rsync to staging dir, then atomic swap (near-zero downtime) ───
      - name: Deploy to AWS (atomic swap)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets.AWS_DEST_PATH_PROD }}
        run: |
          set -e
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem -p $AWS_PORT"
          DEST="${AWS_DEST_PATH%/}"   # strip trailing slash
          TMP="${DEST}_new"
          OLD="${DEST}_old"

          # Ensure both directories exist on the server
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" "mkdir -p $TMP $DEST"

          # Step 1: rsync into staging dir — live site untouched during transfer
          rsync -az --partial --timeout=60 \
            -e "ssh $SSH_OPTS" \
            build/ "$AWS_USER@$AWS_HOST:$TMP/"

          # Step 2: atomic swap — two renames on same filesystem (~1 ms total)
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" \
            "mv $DEST $OLD && mv $TMP $DEST && rm -rf $OLD"

          rm -f private_key.pem
          echo "Production deploy complete."
