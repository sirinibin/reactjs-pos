name: "⚡ Quick Deploy (Emergency — Tests Skipped)"

# MANUAL TRIGGER ONLY — never runs on push.
# Use only when a critical fix must ship immediately.
# Go to Actions → "⚡ Quick Deploy (Emergency — Tests Skipped)" → Run workflow →
# branch master, pick the target. One build goes to every chosen site, test
# first. (v2 has its own copy of this workflow on the v2 branch.)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm emergency deploy (tests will be skipped)'
        required: true
        default: ""
      target:
        description: "Where to deploy"
        required: true
        default: both
        type: choice
        options:
          - both
          - test
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Abort if not confirmed
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "ERROR: You must type exactly 'yes' to confirm. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - name: Abort if not master
        if: ${{ github.ref_name != 'master' }}
        run: |
          echo "ERROR: Branch '${{ github.ref_name }}' is not supported. Use master."
          exit 1

      - name: Show emergency warning
        run: |
          echo "╔══════════════════════════════════════════════════════════════════════╗"
          echo "║  ⚠  EMERGENCY QUICK DEPLOY — TESTS SKIPPED — ${{ github.ref_name }} → ${{ github.event.inputs.target }}"
          echo "╚══════════════════════════════════════════════════════════════════════╝"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 17.9.0

      - name: Install dependencies
        run: npm install

      # ── Build (ESLint + tests SKIPPED); API host is chosen at runtime ─────────
      - name: Build (no tests)
        run: |
          NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" \
          DANGEROUSLY_DISABLE_HOST_CHECK=true \
          REACT_APP_API_URL= \
          GENERATE_SOURCEMAP=false \
          DISABLE_ESLINT_PLUGIN=true \
          npm run build 2>&1 | tee /tmp/build.log
          if grep -qi "compiled with warnings" /tmp/build.log; then
            echo "Build produced warnings — aborting."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-quick-build
          path: build/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Test before production; a failed test deploy stops production.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - target: test
            dest_secret: AWS_DEST_PATH
            site_url: https://test.gulfunionozone.com/
          - target: production
            dest_secret: AWS_DEST_PATH_PROD
            site_url: https://startpos.gulfunionozone.com/

    steps:
      - name: Skip targets that were not chosen
        id: chosen
        run: |
          WANT="${{ github.event.inputs.target }}"
          if [ "$WANT" = both ] || [ "$WANT" = "${{ matrix.target }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.target }} not chosen — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (deploy script)
        if: steps.chosen.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the build
        if: steps.chosen.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-quick-build
          path: build/

      - name: Deploy (atomic swap, verified)
        if: steps.chosen.outputs.go == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets[matrix.dest_secret] }}
          SITE_URL: ${{ matrix.site_url }}
        run: |
          bash .github/scripts/deploy_site.sh
          echo "[${{ matrix.target }}] Quick deploy complete. Run full deploy when stable."
