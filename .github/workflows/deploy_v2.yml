name: Deploy React App to AWS v2 (startpos-v2.gulfunionozone.com)

on:
  push:
    branches:
      - v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Types + ESLint, zero warnings (matches deploy_v2.sh check_eslint) ─────
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint

      # ── Unit + functional tests (matches deploy_v2.sh run_tests) ──────────────
      - name: Run tests
        run: CI=true npm test

      # ── Build — abort on any warning (matches deploy_v2.sh gate) ──────────────
      - name: Build
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          if grep -qiE "\(!\)|warning" /tmp/build.log; then
            echo "Build produced warnings — aborting (matches deploy_v2.sh gate)."
            exit 1
          fi

      # ── Deploy: rsync to staging dir, then atomic swap (near-zero downtime) ───
      - name: Deploy to AWS v2 (atomic swap)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_DEST_PATH: ${{ secrets.AWS_DEST_PATH_V2 }}
        run: |
          set -e
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i private_key.pem -p $AWS_PORT"
          DEST="${AWS_DEST_PATH%/}"
          TMP="${DEST}_new"
          OLD="${DEST}_old"
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" "mkdir -p $TMP $DEST"
          rsync -az --partial --timeout=60 -e "ssh $SSH_OPTS" build/ "$AWS_USER@$AWS_HOST:$TMP/"
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" "mv $DEST $OLD && mv $TMP $DEST && rm -rf $OLD"
          rm -f private_key.pem
