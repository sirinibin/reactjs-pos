<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StartERP Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* =========================================================
   1. TOKENS — light (default), dark (system + explicit)
   ========================================================= */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#EEF2F5; --hover:#F1F5F8; --selected:#E5F1F7;
  --border:#DCE2E7; --border-strong:#C3CDD5; --divider:#E8ECEF;
  --text:#14212C; --text-2:#45576A; --text-3:#6A7C8C; --text-inv:#FFFFFF;
  --accent:#0B6E99; --accent-hover:#085B80; --accent-press:#064A69; --accent-soft:#E4F1F7; --accent-line:#9CCBE0; --on-accent:#FFFFFF;
  --head:#16222F; --head-2:#1F2E3D; --head-line:#2B3C4D; --head-text:#E6EDF3; --head-muted:#97A9BA;
  --side:#FAFBFC; --side-hover:#EEF2F5; --side-active:#E2EFF6;
  --ok:#1C7A4C; --ok-soft:#E3F3EA; --warn:#94600A; --warn-soft:#FCF1DB; --bad:#B3261E; --bad-soft:#FBE8E6; --info:#2B5BA5; --info-soft:#E7EEF8; --neutral:#5B6B79; --neutral-soft:#ECEFF2; --violet:#6247AA; --violet-soft:#EFEAF8;
  --chart-1:#0B6E99; --chart-2:#C27A14; --chart-3:#2E8B62; --chart-4:#6A57B5; --chart-5:#8C99A6; --chart-grid:#E6EAEE;
  --focus:0 0 0 2px var(--surface),0 0 0 4px rgba(11,110,153,.55);
  --shadow-1:0 1px 2px rgba(16,30,44,.06); --shadow-2:0 4px 16px rgba(16,30,44,.10),0 1px 3px rgba(16,30,44,.08); --shadow-3:0 18px 48px rgba(16,30,44,.22);
  --overlay:rgba(14,24,35,.48);
  --paper:#FFFFFF; --paper-text:#111; --paper-line:#D9D9D9;
  --r:4px; --r-lg:6px;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ar:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1722; --surface:#132130; --surface-2:#172738; --surface-3:#1C2E41; --hover:#1A2C3E; --selected:#143A52;
    --border:#243649; --border-strong:#33495F; --divider:#1F3043;
    --text:#E3EAF1; --text-2:#A8B8C7; --text-3:#7D90A2; --text-inv:#0D1722;
    --accent:#3AA3D1; --accent-hover:#5AB5DD; --accent-press:#2B8DB8; --accent-soft:#12334A; --accent-line:#235C7A; --on-accent:#05121B;
    --head:#09121B; --head-2:#111F2C; --head-line:#1F3043; --head-text:#E3EAF1; --head-muted:#8295A8;
    --side:#0F1C29; --side-hover:#162738; --side-active:#153348;
    --ok:#4CC08A; --ok-soft:#123426; --warn:#E3A93E; --warn-soft:#382A10; --bad:#F07A70; --bad-soft:#3D1B19; --info:#79A6EA; --info-soft:#17284A; --neutral:#97A7B6; --neutral-soft:#1E2E3F; --violet:#A994E8; --violet-soft:#2A2248;
    --chart-1:#3AA3D1; --chart-2:#E0A04A; --chart-3:#4CC08A; --chart-4:#A994E8; --chart-5:#6F8396; --chart-grid:#21344A;
    --focus:0 0 0 2px var(--surface),0 0 0 4px rgba(58,163,209,.7);
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 6px 20px rgba(0,0,0,.4); --shadow-3:0 20px 56px rgba(0,0,0,.6);
    --overlay:rgba(3,8,14,.66); --paper:#FDFDFC; --paper-text:#111; --paper-line:#D9D9D9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1722; --surface:#132130; --surface-2:#172738; --surface-3:#1C2E41; --hover:#1A2C3E; --selected:#143A52;
  --border:#243649; --border-strong:#33495F; --divider:#1F3043;
  --text:#E3EAF1; --text-2:#A8B8C7; --text-3:#7D90A2; --text-inv:#0D1722;
  --accent:#3AA3D1; --accent-hover:#5AB5DD; --accent-press:#2B8DB8; --accent-soft:#12334A; --accent-line:#235C7A; --on-accent:#05121B;
  --head:#09121B; --head-2:#111F2C; --head-line:#1F3043; --head-text:#E3EAF1; --head-muted:#8295A8;
  --side:#0F1C29; --side-hover:#162738; --side-active:#153348;
  --ok:#4CC08A; --ok-soft:#123426; --warn:#E3A93E; --warn-soft:#382A10; --bad:#F07A70; --bad-soft:#3D1B19; --info:#79A6EA; --info-soft:#17284A; --neutral:#97A7B6; --neutral-soft:#1E2E3F; --violet:#A994E8; --violet-soft:#2A2248;
  --chart-1:#3AA3D1; --chart-2:#E0A04A; --chart-3:#4CC08A; --chart-4:#A994E8; --chart-5:#6F8396; --chart-grid:#21344A;
  --focus:0 0 0 2px var(--surface),0 0 0 4px rgba(58,163,209,.7);
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 6px 20px rgba(0,0,0,.4); --shadow-3:0 20px 56px rgba(0,0,0,.6);
  --overlay:rgba(3,8,14,.66); --paper:#FDFDFC; --paper-text:#111; --paper-line:#D9D9D9;
  color-scheme:dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:lang(ar) body,body:lang(ar){font-family:var(--f-ar)}
:lang(ar) .mono,:lang(ar) code{font-family:var(--f-mono)}
h1,h2,h3,h4,h5,p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);border-radius:var(--r)}
::selection{background:var(--accent-soft)}
.mono,code{font-family:var(--f-mono);font-size:.94em}
.num{font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.sub{color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.nowrap{white-space:nowrap}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.micro{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
:lang(ar) .micro{letter-spacing:0;font-size:12px}
.fw6{font-weight:600}.fw5{font-weight:500}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.ms-auto{margin-inline-start:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span-all{grid-column:1/-1}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:14px;height:14px}.ico-lg{width:20px;height:20px}.ico-xl{width:24px;height:24px}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* =========================================================
   3. CONTROLS
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,color .12s;user-select:none;text-decoration:none!important}
.btn:hover{background:var(--hover);border-color:var(--text-3)}
.btn:active{background:var(--surface-3)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary:active{background:var(--accent-press)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--hover);border-color:transparent;color:var(--text)}
.btn-link{background:none;border:0;padding:0;height:auto;color:var(--accent)}
.btn-link:hover{background:none;text-decoration:underline}
.btn-danger{color:var(--bad);border-color:var(--border-strong)}
.btn-danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.08);background:var(--ok)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-xs{height:24px;padding:0 8px;font-size:12px}
.btn-lg{height:40px;padding:0 18px;font-size:14px}
.btn-xl{height:48px;padding:0 24px;font-size:15px;font-weight:600}
.btn-icon{width:32px;padding:0}
.btn-sm.btn-icon{width:28px}.btn-xs.btn-icon{width:24px}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-inline-start:-1px}
.btn-group .btn:first-child{border-start-start-radius:var(--r);border-end-start-radius:var(--r);margin-inline-start:0}
.btn-group .btn:last-child{border-start-end-radius:var(--r);border-end-end-radius:var(--r)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;font:500 10.5px/1 var(--f-mono);color:var(--text-2);background:var(--surface)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:4px}
:lang(ar) .field>label,:lang(ar) .lbl{letter-spacing:0;font-size:12px}
.req::after{content:"*";color:var(--bad);margin-inline-start:2px}
.input,.select,.textarea{width:100%;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical;line-height:1.45}
.select{appearance:none;padding-inline-end:28px;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px;background-repeat:no-repeat}
[dir="rtl"] .select{background-position:14px 13px,10px 13px}
.input:hover,.select:hover,.textarea:hover{border-color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.input::placeholder,.textarea::placeholder{color:var(--text-3);opacity:.85}
.input[readonly]{background:var(--surface-2);color:var(--text-2)}
.input.num{text-align:end}
.input.is-bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.input.is-ok{border-color:var(--ok)}
.input-sm{height:28px;font-size:12.5px;padding:0 8px}
.hint{font-size:12px;color:var(--text-3)}
.err{font-size:12px;color:var(--bad);display:flex;gap:4px;align-items:center}
.okmsg{font-size:12px;color:var(--ok);display:flex;gap:4px;align-items:center}
.affix{display:flex;align-items:stretch}
.affix>.input{border-radius:0;min-width:0}
.affix>:first-child{border-start-start-radius:var(--r);border-end-start-radius:var(--r)}
.affix>:last-child{border-start-end-radius:var(--r);border-end-end-radius:var(--r)}
.affix .add{display:flex;align-items:center;padding:0 10px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-2);font-size:12.5px;white-space:nowrap}
.affix .add:first-child{border-inline-end:0}
.affix .add:last-child{border-inline-start:0}
.affix>.btn{border-radius:0;margin-inline-start:-1px}
.affix>.btn:last-child{border-start-end-radius:var(--r);border-end-end-radius:var(--r)}
.input-ico{position:relative}
.input-ico>.ico{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.input-ico>.input{padding-inline-start:32px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:32px;height:18px;border-radius:9px;background:var(--border-strong);position:relative;flex:none;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch input:checked+.trk{background:var(--accent)}
.switch input:checked+.trk::after{inset-inline-start:16px}
.switch input:focus-visible+.trk{box-shadow:var(--focus)}
.seg{display:inline-flex;padding:2px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface-2);gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;height:26px;padding:0 12px;border-radius:3px;font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button:hover{color:var(--text);background:var(--hover)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--border)}
.seg-lg button{height:34px;padding:0 16px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;height:40px;padding:0 12px;font-size:13px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{font-size:11px;background:var(--neutral-soft);color:var(--text-2);padding:0 6px;border-radius:8px;line-height:16px}

/* pills, chips, badges */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--neutral);letter-spacing:.01em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);font-size:12px;color:var(--text-2);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:var(--ok-soft);color:var(--ok)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft);color:var(--warn)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-soft);color:var(--bad)}
.chip.on,.chip-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip-btn{cursor:pointer}
.chip-btn:hover{border-color:var(--text-3)}
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#D93A2B;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tag{display:inline-block;font:500 11px/18px var(--f-mono);padding:0 6px;border-radius:3px;background:var(--surface-3);color:var(--text-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;letter-spacing:.02em}
.avatar.sm{width:22px;height:22px;font-size:9.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* =========================================================
   4. PANELS, TABLES, KPI
   ========================================================= */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-bottom:1px solid var(--border)}
.panel-h h3{font-size:13.5px;font-weight:600;letter-spacing:.005em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panel-h .sub{font-size:12px}
.panel-b{padding:16px}
.panel-f{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.sect-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px}
.sect-t .n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;font-size:13px}
.dl dt{color:var(--text-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl-wrap{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tbl-wrap.fixed-h{max-height:560px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);height:34px;padding:0 12px;text-align:start;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap}
:lang(ar) .tbl th{letter-spacing:0;font-size:12px}
.tbl th.num{text-align:end}
.tbl th .sort{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.tbl th .sort:hover{color:var(--text)}
.tbl tr.filters th{top:34px;height:40px;background:var(--surface);padding:4px 6px;text-transform:none;letter-spacing:0;font-weight:400}
.tbl tr.filters .input,.tbl tr.filters .select{height:28px;font-size:12px;min-width:80px}
.tbl td{white-space:nowrap;height:36px;padding:6px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl.compact td{height:32px;padding:4px 10px}
.tbl tbody tr{transition:background .08s}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr.sel td{background:var(--selected)}
.tbl tbody tr.click{cursor:pointer}
.tbl td.chk,.tbl th.chk{width:36px;padding-inline:12px 0}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0;border-top:1px solid var(--border)}
.tbl .code{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);font-weight:500}
.tbl .act{width:44px;text-align:end;padding-inline-end:8px}
.tbl .two{display:flex;flex-direction:column;line-height:1.25}
.tbl .two small{color:var(--text-3);font-size:11.5px}
.tbl td.wrap,.tbl td .wrap{white-space:normal}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.pager .pages{display:flex;gap:2px;margin-inline-start:auto}
.pager .pages button{min-width:28px;height:28px;border:1px solid transparent;background:none;border-radius:var(--r);font-size:12.5px;color:var(--text-2)}
.pager .pages button:hover{background:var(--hover)}
.pager .pages button.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.kpi{padding:14px 16px;border-inline-end:1px solid var(--divider);min-width:0}
.kpi:last-child{border-inline-end:0}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:500;color:var(--text-3);margin-inline-end:4px;letter-spacing:0}
.kpi .d{font-size:12px;margin-top:4px;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;color:var(--text-3)}
.kpi .d>*{white-space:nowrap}
.kpi .d .up{color:var(--ok);font-weight:600}.kpi .d .down{color:var(--bad);font-weight:600}
.statstrip{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
.statstrip .s{flex:1 0 150px;padding:10px 16px;border-inline-end:1px solid var(--divider)}
.statstrip .s:last-child{border-inline-end:0}
.statstrip .s .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.warn>i{background:var(--warn)}.meter.bad>i{background:var(--bad)}.meter.ok>i{background:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{width:32px;height:32px;stroke-width:1.2}
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid var(--border);border-inline-start:3px solid var(--info);border-radius:var(--r);background:var(--info-soft);font-size:13px}
.banner.warn{border-inline-start-color:var(--warn);background:var(--warn-soft)}
.banner.bad{border-inline-start-color:var(--bad);background:var(--bad-soft)}
.banner.ok{border-inline-start-color:var(--ok);background:var(--ok-soft)}
.banner .ico{margin-top:2px}
.banner.warn .ico{color:var(--warn)}.banner.bad .ico{color:var(--bad)}.banner.ok .ico{color:var(--ok)}.banner .ico{color:var(--info)}
.banner b{font-weight:600}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--divider);font-size:13px;min-width:0}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--hover)}

/* =========================================================
   5. APP SHELL
   ========================================================= */
.hdr{position:sticky;top:0;z-index:40;height:48px;background:var(--head);color:var(--head-text);display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--head-line)}
.hdr .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;letter-spacing:.01em;color:var(--head-text);white-space:nowrap;padding-inline-end:8px}
.hdr .brand .tier{font-weight:400;color:var(--head-muted);font-size:13px;padding-inline-start:10px;border-inline-start:1px solid var(--head-line)}
.logo{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,#0E7FB0,#0A5A7E);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.logo svg{width:16px;height:16px}
.hbtn{height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--head-text);font-size:13px;position:relative;white-space:nowrap}
.hbtn:hover{background:var(--head-2);border-color:var(--head-line)}
.hbtn .badge{position:absolute;top:2px;inset-inline-end:2px}
.hbtn .muted{color:var(--head-muted)}
.store-sw{border-color:var(--head-line);background:var(--head-2);max-width:280px}
.store-sw .ellip{max-width:220px}
.hsearch{flex:1 1 360px;max-width:520px;margin-inline:auto;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r);background:var(--head-2);border:1px solid var(--head-line);color:var(--head-muted);font-size:13px;text-align:start}
.hsearch:hover{border-color:#3C536A;color:var(--head-text)}
.hsearch .kbd{margin-inline-start:auto;background:transparent;color:var(--head-muted);border-color:var(--head-line)}
.trial-chip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:14px;background:rgba(227,169,62,.14);border:1px solid rgba(227,169,62,.4);color:#F2C979;font-size:12px;font-weight:500;white-space:nowrap}
.trial-chip:hover{background:rgba(227,169,62,.22);text-decoration:none}
.trial-chip u{text-decoration:none;color:#FFE1A6;font-weight:600}
.hdr .sep{width:1px;height:24px;background:var(--head-line);margin:0 4px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 48px)}
.app.collapsed{grid-template-columns:56px minmax(0,1fr)}
.side{position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto;background:var(--side);border-inline-end:1px solid var(--border);padding:8px 0 24px;scrollbar-width:thin}
.side .grp{padding:12px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
:lang(ar) .side .grp{letter-spacing:0;font-size:11.5px}
.side a.nav{display:flex;align-items:center;gap:10px;height:30px;margin:0 8px;padding:0 10px;border-radius:var(--r);color:var(--text-2);font-size:13px;text-decoration:none;position:relative;white-space:nowrap}
.side a.nav:hover{background:var(--side-hover);color:var(--text)}
.side a.nav.on{background:var(--side-active);color:var(--accent);font-weight:600}
.side a.nav.on::before{content:"";position:absolute;inset-inline-start:-8px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
[dir="rtl"] .side a.nav.on::before{border-radius:2px 0 0 2px}
.side a.nav .ico{color:var(--text-3)}
.side a.nav.on .ico{color:var(--accent)}
.side a.nav .badge{margin-inline-start:auto}
.side .admin-zone{margin:16px 8px 0;padding-top:8px;border-top:1px dashed var(--border-strong)}
.side .admin-zone .grp{color:var(--violet);display:flex;align-items:center;gap:6px;padding-inline:8px}
.side .collapse-btn{display:flex;align-items:center;gap:10px;height:30px;margin:16px 8px 0;padding:0 10px;border:0;background:none;color:var(--text-3);font-size:12.5px;border-radius:var(--r);width:calc(100% - 16px)}
.side .collapse-btn:hover{background:var(--side-hover)}
.app.collapsed .side .grp,.app.collapsed .side .lbltxt,.app.collapsed .side a.nav .badge{display:none}
.app.collapsed .side a.nav{justify-content:center;padding:0}
.app.collapsed .side .grp-sep{display:block;height:1px;background:var(--divider);margin:8px 12px}
.grp-sep{display:none}
.app.collapsed .side .collapse-btn{justify-content:center;padding:0}
.app.collapsed .side .collapse-btn .ico{transform:scaleX(-1)}
[dir="rtl"] .app:not(.collapsed) .side .collapse-btn .ico{transform:scaleX(-1)}
[dir="rtl"] .app.collapsed .side .collapse-btn .ico{transform:none}
.main{min-width:0;padding:0 24px 48px}
.pagehead{padding:16px 0 16px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:6px;flex-wrap:wrap}
.crumbs a{color:var(--text-3)}
.crumbs a:hover{color:var(--accent)}
.crumbs .ico{width:12px;height:12px}
[dir="rtl"] .crumbs .ico{transform:scaleX(-1)}
.pagehead h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pagehead .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.objhead{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.objhead .top{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.objhead .facts{display:flex;border-top:1px solid var(--divider);overflow-x:auto}
.objhead .fact{padding:10px 16px;border-inline-end:1px solid var(--divider);min-width:140px;flex:1 0 auto}
.objhead .fact:last-child{border-inline-end:0}
.objhead .fact .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filterbar{display:flex;align-items:flex-end;gap:8px;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface)}
.filterbar .field{width:160px}
.filterbar .field.w-lg{width:220px}
.filterbar .field.w-sm{width:120px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);align-items:center}
.drawer-mask{display:none}
.tabbar{display:none}

/* menus, popovers, modal, drawer, toast */
.menu{position:fixed;z-index:200;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-2);padding:4px;max-height:70vh;overflow:auto;animation:pop .12s ease-out}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;background:none;border-radius:3px;font-size:13px;color:var(--text);text-align:start;text-decoration:none;white-space:nowrap}
.menu button:hover,.menu a:hover{background:var(--hover)}
.menu .ico{color:var(--text-3)}
.menu .danger{color:var(--bad)}.menu .danger .ico{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--divider);margin:4px 0}
.menu .mh{padding:8px 10px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes slidein-rtl{from{transform:translateX(-100%)}to{transform:none}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.mask{position:fixed;inset:0;z-index:150;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);animation:up .18s ease-out}
.modal.wide{width:min(880px,100%)}
.modal.xwide{width:min(1100px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(720px,100%);background:var(--surface);z-index:160;box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:slidein .22s ease-out;border-inline-start:1px solid var(--border)}
[dir="rtl"] .drawer{animation-name:slidein-rtl}
.drawer-b{flex:1;overflow:auto;padding:16px}
.toasts{position:fixed;z-index:300;bottom:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px);width:380px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--head);color:var(--head-text);box-shadow:var(--shadow-3);font-size:13px;animation:up .2s ease-out;border-inline-start:3px solid var(--accent)}
.toast.ok{border-inline-start-color:#4CC08A}.toast.bad{border-inline-start-color:#F07A70}.toast.warn{border-inline-start-color:#E3A93E}
.toast .t{font-weight:600}
.toast .s{color:var(--head-muted);font-size:12.5px;margin-top:2px}
.toast .prog{height:3px;border-radius:2px;background:var(--head-line);margin-top:8px;overflow:hidden}
.toast .prog i{display:block;height:100%;width:0;background:#4CC08A;transition:width .25s linear}
.cmdk{width:min(640px,100%);align-self:flex-start;margin-top:10vh}
.cmdk .q{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--border)}
.cmdk .q input{flex:1;border:0;background:none;font-size:15px;height:100%;outline:none}
.cmdk .res{max-height:min(420px,60vh);overflow:auto;padding:6px}
.cmdk .res .grp{padding:8px 10px 4px}
.cmdk .it{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);font-size:13.5px;cursor:pointer;width:100%;border:0;background:none;text-align:start}
.cmdk .it.on{background:var(--accent-soft);color:var(--accent)}
.cmdk .it .ico{color:var(--text-3)}
.cmdk .it.on .ico{color:var(--accent)}
.cmdk .it .hintr{margin-inline-start:auto;font-size:12px;color:var(--text-3)}
.cmdk .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.notif{width:360px;padding:0}
.notif .li{align-items:flex-start;cursor:pointer}
.notif .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.proto{position:fixed;z-index:120;bottom:16px;inset-inline-end:16px;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:18px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);box-shadow:var(--shadow-2);font-size:12.5px;font-weight:600}
.proto:hover{border-color:var(--accent);color:var(--accent)}
.proto .dot{background:var(--accent)}
.proto-menu{width:300px}
.proto-menu .mh{position:sticky;top:-4px;background:var(--surface)}

/* =========================================================
   6. MARKETING
   ========================================================= */
.mk{background:var(--surface);color:var(--text)}
.mk-wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.mk-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.mk-nav .mk-wrap{display:flex;align-items:center;gap:24px;height:64px}
.mk-nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--text);white-space:nowrap}
.mk-nav nav{display:flex;gap:4px}
.mk-nav nav a{padding:8px 12px;font-size:14px;color:var(--text-2);border-radius:var(--r);font-weight:500}
.mk-nav nav a:hover{color:var(--text);background:var(--hover);text-decoration:none}
.mk-nav .right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.mk-burger{display:none}
.mk-hero{position:relative;padding:72px 0 48px;border-bottom:1px solid var(--border);background:
 linear-gradient(var(--surface),var(--surface-2));overflow:hidden}
.mk-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--divider) 1px,transparent 1px),linear-gradient(90deg,var(--divider) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,rgba(0,0,0,.7),transparent 70%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.7),transparent 70%);pointer-events:none}
.mk-hero .mk-wrap{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
:lang(ar) .eyebrow{letter-spacing:0;font-size:13px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--accent)}
.mk-hero h1{font-size:46px;line-height:1.08;letter-spacing:-.025em;font-weight:600;margin:16px 0 18px}
:lang(ar) .mk-hero h1{letter-spacing:0;line-height:1.3;font-size:42px}
.mk-hero p.lead{font-size:17px;line-height:1.6;color:var(--text-2);max-width:520px}
.mk-hero .ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.mk-hero .fine{margin-top:16px;font-size:12.5px;color:var(--text-3);display:flex;gap:16px;flex-wrap:wrap}
.mk-hero .fine span{display:inline-flex;gap:6px;align-items:center}
.composite{position:relative;min-height:420px}
.cp-win{position:absolute;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow-3);overflow:hidden}
.cp-dash{inset-inline-start:0;top:0;width:88%;}
.cp-pos{inset-inline-end:0;bottom:-8px;width:44%}
.cp-bar{height:28px;background:var(--head);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--head-muted);font-size:10px}
.cp-bar i{width:7px;height:7px;border-radius:50%;background:#3C536A;display:block}
.cp-body{display:grid;grid-template-columns:72px 1fr;min-height:300px}
.cp-side{background:var(--side);border-inline-end:1px solid var(--border);padding:8px 6px;display:flex;flex-direction:column;gap:5px}
.cp-side b{height:6px;border-radius:3px;background:var(--border)}
.cp-side b.on{background:var(--accent);opacity:.7}
.cp-main{padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.cp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cp-kpi{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:6px 8px}
.cp-kpi s{display:block;text-decoration:none;font-size:7.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.cp-kpi strong{font-size:12px;font-variant-numeric:tabular-nums}
.cp-chart{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:8px;height:120px}
.cp-rows{background:var(--surface);border:1px solid var(--border);border-radius:3px}
.cp-rows div{display:grid;grid-template-columns:1.3fr 1.6fr 1fr .9fr;gap:6px;padding:5px 8px;font-size:8.5px;border-bottom:1px solid var(--divider);align-items:center}
.cp-rows div:last-child{border:0}
.cp-rows .p{justify-self:start;font-size:7.5px;padding:1px 5px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.cp-pos .pg{padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg)}
.cp-pos .pg span{height:34px;border-radius:3px;background:var(--surface);border:1px solid var(--border);font-size:7.5px;padding:4px;color:var(--text-2)}
.cp-pos .tot{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);font-size:10px}
.cp-pos .tot b{font-size:14px;font-variant-numeric:tabular-nums}
.cp-pos .pay{margin:0 10px 10px;height:26px;border-radius:3px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.trust{border-bottom:1px solid var(--border);background:var(--surface)}
.trust .mk-wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.trust .t{display:flex;align-items:center;gap:12px;padding:20px 16px;border-inline-end:1px solid var(--divider);font-size:13.5px;font-weight:500}
.trust .t:last-child{border-inline-end:0}
.trust .t .ib{width:36px;height:36px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.trust .t small{display:block;color:var(--text-3);font-weight:400;font-size:12px}
.mk-sec{padding:80px 0;border-bottom:1px solid var(--border)}
.mk-sec.alt{background:var(--surface-2)}
.mk-sec h2{font-size:32px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:12px 0 12px;max-width:720px}
:lang(ar) .mk-sec h2{letter-spacing:0;line-height:1.35}
.mk-sec p.lead{font-size:16px;color:var(--text-2);max-width:680px;line-height:1.6}
.modgrid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:40px;border-top:1px solid var(--border);border-inline-start:1px solid var(--border)}
.mod{padding:24px;border-inline-end:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);transition:background .15s}
.mod:hover{background:var(--surface-2)}
.mod .ib{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--accent-line);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.mod h3{font-size:16px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.mod p{font-size:13.5px;color:var(--text-2);line-height:1.55}
.mod ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.mod li{font-size:11.5px;color:var(--text-2);background:var(--surface-3);padding:2px 8px;border-radius:3px}
.ind-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:40px}
.ind{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s;cursor:pointer;text-align:start}
.ind:hover{border-color:var(--accent);transform:translateY(-2px)}
.ind .ib{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ind h4{font-size:14px;font-weight:600}
.ind p{font-size:12.5px;color:var(--text-2);line-height:1.5}
.zflow{display:grid;grid-template-columns:repeat(5,1fr);margin-top:40px;position:relative}
.zstep{position:relative;padding:0 16px 0 0;padding-inline:0 16px}
.zstep .n{width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:13px}
.zstep::before{content:"";position:absolute;top:17px;inset-inline-start:36px;inset-inline-end:0;height:2px;background:var(--accent-line)}
.zstep:last-child::before{display:none}
.zstep h4{font-size:14.5px;font-weight:600;margin:16px 0 6px}
.zstep p{font-size:13px;color:var(--text-2);line-height:1.5}
.zstep code{display:inline-block;margin-top:8px;font-size:11px;background:var(--surface-3);padding:2px 6px;border-radius:3px}
.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.pcard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px}
.pcard .art{height:120px;background:var(--surface-2);border-radius:3px;display:flex;align-items:flex-end;justify-content:center;padding-top:16px;overflow:hidden;border:1px solid var(--divider)}
.pcard .art .paper{background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px;display:flex;flex-direction:column;gap:4px}
.pcard .art .paper i{display:block;height:3px;background:#D5DAE0;border-radius:2px}
.pcard h4{font-size:14.5px;font-weight:600}
.pcard p{font-size:12.5px;color:var(--text-2);line-height:1.5}
.testi{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.tq{border:1px solid var(--border);border-radius:var(--r);padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.tq blockquote{margin:0;font-size:15px;line-height:1.6;color:var(--text)}
.tq .who{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:auto}
.tq .who small{display:block;color:var(--text-3)}
.faq{margin-top:32px;border-top:1px solid var(--border)}
.faq details{border-bottom:1px solid var(--border)}
.faq summary{list-style:none;display:flex;align-items:center;gap:12px;padding:18px 4px;font-size:15px;font-weight:500;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{margin-inline-start:auto;transition:transform .15s;color:var(--text-3)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq details p{padding:0 4px 18px;color:var(--text-2);font-size:14px;line-height:1.6;max-width:820px}
.mk-foot{background:var(--head);color:var(--head-muted);padding:56px 0 24px;font-size:13px}
.mk-foot .cols{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:32px}
.mk-foot h5{color:var(--head-text);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.mk-foot a{display:block;color:var(--head-muted);padding:3px 0}
.mk-foot a:hover{color:var(--head-text)}
.mk-foot .legal{border-top:1px solid var(--head-line);margin-top:40px;padding-top:20px;display:flex;gap:24px;flex-wrap:wrap;font-size:12px}
.cta-band{background:var(--head);color:var(--head-text);padding:56px 0}
.cta-band .mk-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cta-band h2{font-size:28px;font-weight:600;letter-spacing:-.01em;color:var(--head-text);margin:0}
.cta-band p{color:var(--head-muted);margin-top:6px}

/* pricing */
.billing-t{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px}
.save-pill{font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:10px}
.plans{display:grid;grid-template-columns:repeat(4,1fr);margin-top:32px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.plan{padding:28px 24px;border-inline-end:1px solid var(--border);display:flex;flex-direction:column;gap:16px;position:relative}
.plan:last-child{border-inline-end:0}
.plan.pop{background:var(--surface);box-shadow:inset 0 3px 0 var(--accent);}
.plan.pop .poptag{position:absolute;top:-11px;inset-inline-start:24px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:3px}
.plan h3{font-size:18px;font-weight:600}
.plan .desc{font-size:13px;color:var(--text-2);min-height:40px}
.plan .price{display:flex;align-items:baseline;gap:6px}
.plan .price .cur{font-size:14px;font-weight:600;color:var(--text-2)}
.plan .price .amt{font-size:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.plan .price .per{font-size:13px;color:var(--text-3)}
.plan .note{font-size:12px;color:var(--text-3);min-height:18px}
.plan ul{list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--divider);display:flex;flex-direction:column;gap:9px;font-size:13px}
.plan li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.plan li .ico{color:var(--ok);margin-top:2px}
.addons{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:24px}
.addon{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:var(--surface)}
.addon b{display:block;font-size:13px;margin-bottom:4px}
.addon span{font-size:13px;color:var(--text-2)}
.cmp{margin-top:24px}
.cmp td,.cmp th{text-align:center}
.cmp td:first-child,.cmp th:first-child{text-align:start}
.cmp tr.g td{background:var(--surface-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);text-align:start}
.cmp .y{color:var(--ok)}.cmp .n{color:var(--text-3)}
.trial-banner{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:var(--r);padding:12px 16px;font-size:14px;font-weight:500;margin-top:24px;text-align:center;flex-wrap:wrap}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface)}
.auth-side{background:var(--head);color:var(--head-text);padding:48px;display:flex;flex-direction:column;gap:32px;position:relative;overflow:hidden}
.auth-side::after{content:"";position:absolute;inset:auto -120px -160px auto;width:480px;height:480px;border-radius:50%;border:1px solid var(--head-line);box-shadow:0 0 0 60px rgba(255,255,255,.015),0 0 0 120px rgba(255,255,255,.012)}
[dir="rtl"] .auth-side::after{inset:auto auto -160px -120px}
.auth-side h2{font-size:28px;line-height:1.25;font-weight:600;letter-spacing:-.01em;max-width:440px}
.auth-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:14px;color:var(--head-muted)}
.auth-side li{display:flex;gap:10px}
.auth-side li .ico{color:#5AB5DD;margin-top:2px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth-card{width:100%;max-width:480px}
.auth-card h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.steps{display:flex;gap:0;margin:24px 0}
.steps .st{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-3)}
.steps .st .bar{height:3px;background:var(--border);border-radius:2px}
.steps .st.on .bar,.steps .st.done .bar{background:var(--accent)}
.steps .st.on{color:var(--accent);font-weight:600}
.steps .st.done{color:var(--text-2)}
.steps .st+.st{margin-inline-start:8px}
.strength{display:flex;gap:4px;margin-top:6px}
.strength i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.strength.s1 i:nth-child(-n+1){background:var(--bad)}
.strength.s2 i:nth-child(-n+2){background:var(--warn)}
.strength.s3 i:nth-child(-n+3){background:var(--chart-3)}
.strength.s4 i{background:var(--ok)}
.planpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.planpick label{border:1px solid var(--border-strong);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.planpick label:hover{border-color:var(--text-3)}
.planpick input{position:absolute;opacity:0}
.planpick label.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.planpick b{font-size:14px}
.planpick span{font-size:12.5px;color:var(--text-2)}
.otp{display:flex;gap:8px}
.otp input{width:48px;height:52px;text-align:center;font-size:20px;font-weight:600;font-family:var(--f-mono)}

/* =========================================================
   7. SCREEN-SPECIFIC
   ========================================================= */
/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}.c5{grid-column:span 5}.c7{grid-column:span 7}.c3{grid-column:span 3}.c9{grid-column:span 9}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-3);font-size:10px;font-family:var(--f-ui)}
.hbar{display:flex;flex-direction:column;gap:12px}
.hbar .r{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--chart-1)}
.zh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zh .b{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.zh .b .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* sales invoice form */
.form-head{position:sticky;top:48px;z-index:20;background:var(--bg);margin:0 -24px;padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form-head h1{font-size:18px;font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 16px}
.form-grid .f2{grid-column:span 2}.form-grid .f3{grid-column:span 3}.form-grid .f4{grid-column:span 4}.form-grid .f6{grid-column:span 6}.form-grid .f8{grid-column:span 8}.form-grid .f12{grid-column:span 12}.form-grid .f5{grid-column:span 5}.form-grid .f7{grid-column:span 7}
.ta{position:relative}
.ta-list{position:absolute;top:calc(100% + 4px);inset-inline:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-2);overflow:hidden}
.ta-list .ta-h{display:grid;grid-template-columns:70px 1.6fr 1fr 1.2fr 90px;gap:8px;padding:6px 10px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--border);font-weight:600}
.ta-list .ta-r{display:grid;grid-template-columns:70px 1.6fr 1fr 1.2fr 90px;gap:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--divider);align-items:center}
.ta-list .ta-r:hover{background:var(--accent-soft)}
.ta-list.prod .ta-h,.ta-list.prod .ta-r{grid-template-columns:110px 2fr 1fr 80px 90px}
.scan{position:relative}
.scan .input{height:40px;font-family:var(--f-mono);font-size:14px;padding-inline-start:40px;border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scan>.ico{position:absolute;inset-inline-start:12px;top:12px;color:var(--accent)}
.lines td{padding:4px 6px;height:40px}
.lines th{padding:0 8px}
.lines .input{height:30px;font-size:12.5px;padding:0 6px;min-width:64px}
.lines .input.num{min-width:84px}
.lines .input.name{min-width:240px}
.lines tr.warnrow td{background:var(--warn-soft)}
.lines tr.warnrow:hover td{background:var(--warn-soft)}
.lines .wmsg{font-size:11.5px;color:var(--warn);display:flex;align-items:center;gap:4px;margin-top:2px;white-space:nowrap}
.stockbtn{border:0;background:none;padding:2px 6px;border-radius:3px;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.stockbtn:hover{background:var(--accent-soft)}
.sumtbl{width:100%;font-size:13px;border-collapse:collapse}
.sumtbl td{padding:6px 0;border-bottom:1px solid var(--divider);vertical-align:middle}
.sumtbl td:last-child{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtbl .input{height:28px;width:110px;text-align:end;display:inline-block}
.sumtbl tr.total td{border-top:2px solid var(--text);border-bottom:0;padding-top:10px;font-size:16px;font-weight:700}
.keyhints{position:sticky;bottom:0;z-index:15;margin:16px -24px -48px;padding:8px 24px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:18px;font-size:12px;color:var(--text-2);flex-wrap:wrap;align-items:center}
.keyhints span{display:inline-flex;gap:6px;align-items:center}

/* invoice document */
.doc{background:var(--paper);color:var(--paper-text);border:1px solid var(--border);box-shadow:var(--shadow-2);padding:40px 44px;font-size:12px;line-height:1.45;max-width:820px;margin:0 auto;font-family:var(--f-ui)}
.doc h2{font-size:18px;font-weight:700;letter-spacing:.02em}
.doc .ar{font-family:var(--f-ar);direction:rtl}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px}
.doc th{background:#F1F3F5;text-align:start;padding:6px 8px;border:1px solid var(--paper-line);font-weight:600;font-size:10.5px}
.doc td{padding:6px 8px;border:1px solid var(--paper-line)}
.doc .num{text-align:end}
.doc .hdr2{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;padding-bottom:16px;border-bottom:2px solid #111}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.doc .box{border:1px solid var(--paper-line);padding:10px}
.doc .box .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .ev{display:grid;grid-template-columns:20px 1fr;gap:10px;position:relative;padding-bottom:14px;font-size:12.5px}
.timeline .ev::before{content:"";position:absolute;inset-inline-start:9px;top:16px;bottom:0;width:1px;background:var(--border)}
.timeline .ev:last-child::before{display:none}
.timeline .ev .d{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin:4px 0 0 4px;margin-inline:4px 0}
.hash{font-family:var(--f-mono);font-size:11.5px;word-break:break-all;background:var(--surface-2);border:1px solid var(--divider);padding:6px 8px;border-radius:3px;color:var(--text-2)}

/* POS */
.pos{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);background:var(--bg)}
.pos-top{height:52px;background:var(--head);color:var(--head-text);display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--head-line)}
.pos-top .meta{display:flex;gap:16px;font-size:12px;color:var(--head-muted);margin-inline-start:auto;align-items:center}
.pos-top .meta b{color:var(--head-text);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync .dot{background:#4CC08A;box-shadow:0 0 0 3px rgba(76,192,138,.2)}
.verts{display:flex;gap:4px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.verts button{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.verts button:hover{border-color:var(--text-3);color:var(--text)}
.verts button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pos-body{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.pos-left{min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.pos-cart{border-inline-start:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.cart-lines{flex:1;overflow:auto;min-height:0}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--divider);font-size:13px}
.cl .nm{font-weight:500;line-height:1.3}
.cl .nm small{display:block;color:var(--text-3);font-weight:400;font-size:11.5px}
.cl .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.cl.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--surface-2);font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center}
.qty button:hover{background:var(--hover)}
.qty span{min-width:48px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.cart-sum{border-top:1px solid var(--border);padding:10px 14px;font-size:13px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.cart-sum .r{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.cart-sum .tot{font-size:22px;font-weight:700;padding-top:6px;margin-top:4px;border-top:1px solid var(--border)}
.cart-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px 0}
.cart-acts .btn{height:48px;flex-direction:column;gap:2px;font-size:11.5px}
.paybtn{margin:10px 14px 14px;height:60px;border-radius:var(--r);border:0;background:var(--ok);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.paybtn:hover{filter:brightness(1.07)}
.paybtn[disabled]{opacity:.5}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:96px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;transition:border-color .1s,transform .06s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.tile .ar{font-family:var(--f-ar);font-size:12px;color:var(--text-3)}
.tile .pr{margin-top:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.tile .meta{font-size:11.5px;color:var(--text-3)}
.tile .stk{position:absolute;top:8px;inset-inline-end:8px;font-size:11px}
.tile.big{min-height:110px}
.tile.sw{border-top:3px solid var(--sw,var(--accent))}
.catbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.catbar button{height:44px;padding:0 16px;border:1px solid var(--border);background:var(--surface);border-radius:22px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--text-2)}
.catbar button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.floor{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tbl-t{height:84px;border-radius:8px;border:2px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tbl-t b{font-size:16px}
.tbl-t.occ{border-color:var(--accent);background:var(--accent-soft)}
.tbl-t.bill{border-color:var(--warn);background:var(--warn-soft)}
.tbl-t.sel{box-shadow:0 0 0 3px var(--accent)}
.jobsteps{display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.jobsteps button{flex:1;height:44px;border:0;background:none;font-size:12.5px;font-weight:500;color:var(--text-3);border-inline-end:1px solid var(--divider);display:flex;align-items:center;justify-content:center;gap:6px}
.jobsteps button.done{color:var(--ok);background:var(--ok-soft)}
.jobsteps button.on{color:var(--on-accent);background:var(--accent)}
.scale{background:#0B1A12;color:#7CFFB2;font-family:var(--f-mono);border-radius:var(--r);padding:12px 16px;display:flex;align-items:baseline;gap:8px;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.scale .w{font-size:40px;font-weight:600;letter-spacing:.04em;text-shadow:0 0 12px rgba(124,255,178,.35)}
.bigscan{display:flex;gap:8px}
.bigscan .input{height:56px;font-size:20px;font-family:var(--f-mono);border:2px solid var(--accent)}
.lastscan{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:16px}
.token{font-size:56px;font-weight:700;font-family:var(--f-mono);line-height:1;color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{height:56px;font-size:20px;font-weight:600;border:1px solid var(--border);background:var(--surface);border-radius:var(--r)}
.keypad button:hover{background:var(--hover)}
.keypad button:active{background:var(--surface-3)}
.paymeth{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.paymeth button{height:56px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600}
.paymeth button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{height:48px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r);font-weight:600;font-variant-numeric:tabular-nums}
.paydisp{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.paydisp .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.receipt{background:var(--paper);color:var(--paper-text);width:302px;margin:0 auto;padding:16px 14px;font-family:var(--f-mono);font-size:11px;line-height:1.45;box-shadow:var(--shadow-2);border:1px solid var(--paper-line);position:relative}
.receipt::after{content:"";position:absolute;inset-inline:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 4px,var(--paper) 0) 0 0/8px 8px,linear-gradient(45deg,transparent 4px,var(--paper) 0) 0 0/8px 8px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .ar{font-family:var(--f-ar);direction:rtl}
.receipt.w58{width:220px;font-size:10px}
.receipt.w112{width:420px}
.sheet-h{display:none}

/* print studio + label studio */
.studio{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;align-items:start}
.prn{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--divider);cursor:pointer;align-items:flex-start}
.prn:hover{background:var(--hover)}
.prn.on{background:var(--selected);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .prn.on{box-shadow:inset -3px 0 0 var(--accent)}
.prn .ic{width:32px;height:32px;border-radius:var(--r);background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-2)}
.prn b{font-size:13px;display:block}
.prn small{font-size:11.5px;color:var(--text-3);display:block}
.stage{background:repeating-conic-gradient(var(--surface-3) 0 25%,var(--surface-2) 0 50%) 0 0/16px 16px;border:1px solid var(--border);border-radius:var(--r);padding:24px;min-height:560px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.a4{width:560px;min-height:792px;background:var(--paper);color:var(--paper-text);box-shadow:var(--shadow-2);padding:32px;font-size:9.5px;flex:none;line-height:1.4}
.a4.a5{width:400px;min-height:566px;padding:22px;font-size:8.5px}
.a4.letter{width:578px;min-height:748px}
.a4.dm{width:600px;min-height:auto;font-family:var(--f-mono);background:var(--paper) repeating-linear-gradient(var(--paper) 0 24px,#EAF4EC 24px 48px);padding:28px 40px;border-inline:14px dotted #ccc}
.a4 table{width:100%;border-collapse:collapse}
.a4 th,.a4 td{border:1px solid #D5D5D5;padding:4px 6px;text-align:start}
.a4 th{background:#F2F3F5;font-size:8.5px}
.a4 .num{text-align:end}
.a4 .ar{font-family:var(--f-ar);direction:rtl;text-align:end}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--divider);font-size:13px}
.optrow:last-child{border-bottom:0}
.tplgal{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tpl{border:1px solid var(--border);border-radius:var(--r);padding:8px;cursor:pointer;background:var(--surface);text-align:start}
.tpl:hover{border-color:var(--text-3)}
.tpl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl .th{height:70px;background:var(--surface-2);border-radius:2px;margin-bottom:6px;padding:8px;display:flex;flex-direction:column;gap:3px}
.tpl .th i{display:block;height:3px;background:var(--border-strong);border-radius:2px}
.tpl span{font-size:11.5px;font-weight:500;display:block;line-height:1.3}
.labelsheet{display:grid;gap:8px;justify-content:center}
.lbl-card{background:#fff;color:#111;border:1px dashed #9AA5AF;border-radius:3px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;text-align:center;font-size:9px;line-height:1.2}
.lbl-card .n{font-weight:700;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-card .ar{font-family:var(--f-ar)}
.lbl-card .p{font-weight:700;font-size:12px}
.codebox{background:#0F1A24;color:#B9E3F7;font:12px/1.55 var(--f-mono);padding:12px 14px;border-radius:var(--r);overflow:auto;max-height:300px;white-space:pre;direction:ltr;text-align:left}
.codebox .k{color:#F2C979}

/* zatca */
.stepper{display:flex;flex-direction:column}
.zs{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;position:relative;padding-bottom:4px}
.zs::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--border)}
.zs.done::before{background:var(--ok)}
.zs:last-child::before{display:none}
.zs .n{width:32px;height:32px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--text-3);z-index:1}
.zs.done .n{border-color:var(--ok);background:var(--ok);color:#fff}
.zs.on .n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.zs .zh2{display:flex;align-items:center;gap:8px;min-height:32px;font-weight:600;font-size:14px}
.zs .zb{padding:4px 0 20px}
.zs>div{min-width:0}
.zs:not(.on) .zb .detail{display:none}
.chain{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 0}
.blk{flex:none;width:170px;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;background:var(--surface);font-size:11.5px}
.blk .h{font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{width:28px;height:2px;background:var(--ok);flex:none;position:relative}
.link.broken{background:repeating-linear-gradient(90deg,var(--bad) 0 4px,transparent 4px 8px)}

/* billing */
.dropzone{border:1.5px dashed var(--border-strong);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .ico{width:28px;height:28px;color:var(--accent)}
.filecard{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.filecard .th{width:56px;height:56px;border-radius:3px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.filecard .th img{width:100%;height:100%;object-fit:cover}
.bankrow{display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--divider);font-size:13px}
.bankrow:last-child{border-bottom:0}
.sample{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--warn);border:1px solid var(--warn);padding:1px 6px;border-radius:3px;text-transform:uppercase}

/* email */
.provgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.prov{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;min-height:76px}
.prov:hover{border-color:var(--text-3)}
.prov.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.prov .pl{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.prov b{font-size:12.5px;line-height:1.25}
.prov small{font-size:11px;color:var(--text-3)}
.log{font:12px/1.7 var(--f-mono);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;min-height:150px}
.log .ln{display:flex;gap:10px;animation:fade .2s}
.log .ln .tm{color:var(--text-3)}
.log .ln .st{margin-inline-start:auto}

/* roles */
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:start}
.matrix input{width:16px;height:16px;accent-color:var(--accent)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(260px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-3);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:400px}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-size:12.5px;font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;box-shadow:var(--shadow-1);cursor:grab}
.kcard:hover{border-color:var(--accent-line)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid #222;border-radius:3px;overflow:hidden;font-family:var(--f-mono);font-weight:600;font-size:11.5px;background:#fff;color:#111;height:22px}
.plate .ksa{background:#0B6E4F;color:#fff;font-size:8px;display:flex;align-items:center;padding:0 3px;writing-mode:vertical-rl;letter-spacing:.05em}
.plate span{display:flex;align-items:center;padding:0 6px}
.plate span+span{border-inline-start:1px solid #222}
.reports{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rcard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:start;transition:border-color .12s}
.rcard:hover{border-color:var(--accent)}
.rcard .ic{width:32px;height:32px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.rcard b{font-size:13.5px}
.rcard small{color:var(--text-3);font-size:12px;line-height:1.45}
.vatbox{display:grid;grid-template-columns:40px 1fr 140px 140px 140px;font-size:12.5px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.vatbox>div{padding:8px 10px;border-bottom:1px solid var(--divider);border-inline-end:1px solid var(--divider)}
.vatbox .h{background:var(--surface-2);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.vatbox .num{text-align:end}

/* =========================================================
   8. RESPONSIVE
   ========================================================= */
@media (max-width:1439px){
  .studio{grid-template-columns:260px minmax(0,1fr) 300px}
  .ind-grid{grid-template-columns:repeat(4,1fr)}
  .provgrid{grid-template-columns:repeat(4,1fr)}
  .reports{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:1279px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(3){border-inline-end:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--divider)}
  .studio{grid-template-columns:minmax(0,1fr) 320px}
  .studio>.st-left{grid-column:1/-1}
  .plans{grid-template-columns:repeat(2,1fr)}
  .plan:nth-child(2){border-inline-end:0}
  .plan:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .addons{grid-template-columns:repeat(3,1fr)}
  .pos-body{grid-template-columns:minmax(0,1fr) 360px}
  .tplgal{grid-template-columns:repeat(4,1fr)}
  .c8,.c4,.c6,.c5,.c7,.c3,.c9{grid-column:span 12}
  .dash-grid .c4.half,.dash-grid .c6{grid-column:span 6}
  .print-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid .f2{grid-column:span 4}.form-grid .f3{grid-column:span 6}.form-grid .f4{grid-column:span 6}.form-grid .f5,.form-grid .f7,.form-grid .f8,.form-grid .f6{grid-column:span 12}
}
@media (max-width:1023px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:90;top:48px;bottom:0;inset-inline-start:0;width:280px;height:auto;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-3)}
  [dir="rtl"] .side{transform:translateX(100%)}
  .app.drawer-open .side{transform:none}
  .app.drawer-open .drawer-mask{display:block;position:fixed;inset:48px 0 0;z-index:80;background:var(--overlay)}
  .app.collapsed .side .grp,.app.collapsed .side .lbltxt{display:revert}
  .app.collapsed .side a.nav{justify-content:flex-start;padding:0 10px}
  .side .collapse-btn{display:none}
  .hsearch .lbltxt,.hsearch .kbd{display:none}
  .hsearch{flex:0 0 32px;width:32px;padding:0;justify-content:center;margin-inline:auto 0}
  .hdr .brand .tier{display:none}
  .main{padding:0 16px 88px}
  .form-head{margin:0 -16px;padding:10px 16px}
  .keyhints{margin:16px -16px -88px;padding:8px 16px}
  .mk-hero .mk-wrap{grid-template-columns:1fr}
  .composite{min-height:380px}
  .trust .mk-wrap{grid-template-columns:repeat(2,1fr)}
  .trust .t:nth-child(2){border-inline-end:0}
  .modgrid{grid-template-columns:repeat(2,1fr)}
  .zflow{grid-template-columns:1fr;gap:20px}
  .zstep{display:grid;grid-template-columns:36px 1fr;gap:0 14px}
  .zstep h4{margin-top:6px}
  .zstep>div{grid-column:2}
  .zstep::before{top:36px;bottom:-20px;inset-inline-start:17px;width:2px;height:auto;inset-inline-end:auto}
  .testi{grid-template-columns:1fr}
  .mk-foot .cols{grid-template-columns:repeat(2,1fr)}
  .mk-nav nav,.mk-nav .right .hide-m{display:none}
  .mk-burger{display:inline-flex}
  .mk-nav.open nav{display:flex;flex-direction:column;position:absolute;top:64px;inset-inline:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px 16px;box-shadow:var(--shadow-2)}
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .pos-body{grid-template-columns:minmax(0,1fr) 340px}
  .pos-top .meta .hide-t{display:none}
  .floor{grid-template-columns:repeat(4,1fr)}
  .studio{grid-template-columns:minmax(0,1fr)}
  .tplgal{grid-template-columns:repeat(3,1fr)}
  .reports{grid-template-columns:repeat(3,1fr)}
  .provgrid{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ind-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:767px){
  .hdr .store-sw .ellip{max-width:110px}
  .hdr .hide-p{display:none!important}
  .trial-chip .lbltxt{display:none}
  .pagehead h1{font-size:19px}
  .pagehead .acts{margin-inline-start:0;width:100%}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-bottom:1px solid var(--divider)}
  .kpi:nth-child(odd){border-inline-end:1px solid var(--divider)!important}
  .kpi:nth-child(even){border-inline-end:0}
  .kpi .v{font-size:18px}
  .g2,.g3,.g4,.g6{grid-template-columns:minmax(0,1fr)}
  .span2,.span3{grid-column:auto}
  .dash-grid .c4.half,.dash-grid .c6{grid-column:span 12}
  .form-grid .f2,.form-grid .f3,.form-grid .f4{grid-column:span 12}
  .mk-wrap{padding:0 16px}
  .mk-hero{padding:40px 0 32px}
  .mk-hero h1{font-size:32px}
  :lang(ar) .mk-hero h1{font-size:30px}
  .composite{min-height:300px}
  .cp-pos{display:none}
  .cp-dash{width:100%;position:relative}
  .cp-kpis{grid-template-columns:repeat(2,1fr)}
  .mk-sec{padding:56px 0}
  .mk-sec h2{font-size:25px}
  .trust .mk-wrap{grid-template-columns:1fr}
  .trust .t{border-inline-end:0;border-bottom:1px solid var(--divider)}
  .modgrid{grid-template-columns:1fr}
  .ind-grid{grid-template-columns:repeat(2,1fr)}
  .print-grid{grid-template-columns:1fr}
  .plans{grid-template-columns:1fr}
  .plan{border-inline-end:0!important;border-bottom:1px solid var(--border)}
  .addons{grid-template-columns:repeat(2,1fr)}
  .mk-foot .cols{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:70;bottom:0;inset-inline:0;height:60px;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--text-3);text-decoration:none;font-weight:500}
  .tabbar a.on{color:var(--accent)}
  .tabbar a .ico{width:20px;height:20px}
  .proto{bottom:72px}
  .pos.has-tab .proto{bottom:16px}
  .toasts{bottom:72px;inset-inline:16px;width:auto}
  .filterbar .field,.filterbar .field.w-lg,.filterbar .field.w-sm{width:calc(50% - 4px)}
  .studio .stage{padding:12px;min-height:420px}
  .a4{transform:scale(.56);transform-origin:top center;margin-bottom:-340px}
  [dir="rtl"] .a4{transform-origin:top center}
  .a4.a5{transform:scale(.78);margin-bottom:-120px}
  .tplgal{grid-template-columns:repeat(2,1fr)}
  .reports{grid-template-columns:repeat(2,1fr)}
  .provgrid{grid-template-columns:repeat(2,1fr)}
  .vatbox{grid-template-columns:28px minmax(0,1fr) 92px 92px}
  .vatbox .hm{display:none}
  .hbar .r{grid-template-columns:90px 1fr 80px}
  .zh{grid-template-columns:repeat(3,1fr)}
  .bankrow{grid-template-columns:1fr auto}
  .bankrow .k{grid-column:1/-1}
  .doc{padding:20px 16px}
  .doc .hdr2{grid-template-columns:1fr}
  .doc .meta{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:8px}
  /* POS phone */
