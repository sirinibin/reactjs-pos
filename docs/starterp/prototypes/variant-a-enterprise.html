function areaChart(series, o = {}) {
  const W = o.w || 640, H = o.h || 220, P = { l: 44, r: 8, t: 10, b: 22 };
  const n = series[0].data.length, max = Math.ceil(Math.max(...series.flatMap(s => s.data)) / 10000) * 10000 || 1;
  const x = i => P.l + (i * (W - P.l - P.r)) / (n - 1), y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k, yy = y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="var(--chart-grid)"/><text x="${P.l - 6}" y="${yy + 3}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`; }
  for (let i = 0; i < n; i += Math.ceil(n / 6)) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${o.labels ? o.labels[i] : i + 1}</text>`;
  const paths = series.map((s, si) => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const line = 'M' + pts.join('L');
    return `<defs><linearGradient id="ag${si}${o.id || ''}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${s.fill ? .22 : 0}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#ag${si}${o.id || ''})"/><path d="${line}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.8}" ${s.dash ? 'stroke-dasharray="4 3"' : ''} stroke-linejoin="round"/>`;
  }).join('');
  const lastI = n - 1, s0 = series[0];
  const marker = `<circle cx="${x(lastI)}" cy="${y(s0.data[lastI])}" r="3.5" fill="var(--surface)" stroke="${s0.color}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Chart')}">${g}${paths}${marker}</svg>`;
}
function donut(parts, size = 150) {

  const segs = parts.map(p => { const len = (p.v / tot) * C; const s = `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len - 1.5} ${C - len + 1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}" role="img" aria-label="Payment methods">${segs}<text x="75" y="71" text-anchor="middle" style="font-size:10px;fill:var(--text-3)">This month</text><text x="75" y="88" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">${fmt(tot / 1000, 0)}k</text></svg>`;
}

function newInv() {
  const P = D.products;
  const ln = (p, qty, price, disc = 0, from = 'main') => ({ pn: p.pn, name: p.name, cost: p.cost, st: p.st, rack: p.rack, unit: p.unit, qty, price, disc, from });
  return {
    cust: D.customers[0], custQ: D.customers[0].name, walkin: '', date: '2026-10-05', phone: D.customers[0].phone, vat: D.customers[0].vat, addr: 'Bldg 2231, Prince Turki St, Al Khobar 34424', remarks: 'Deliver to site gate 3 — call before arrival.', po: 'GUO-PO-2026-0918', invId: '',
    form: 'workshop', vehicle: 'ABC 1234 — Toyota Camry 2020 (White)', km: '84,210', job: 'RJ-2026-0311',
    lines: [ln(P[0], 2, 215), ln(P[1], 4, 32, 2), ln(P[2], 2, 165, 0, 'wh1'), ln(P[3], 1, 36)],
    ship: 25, discMode: 'ex', discVal: 20, roundAuto: true, roundVal: 0, vatPct: 15,
    pays: [{ date: '2026-10-05', amount: 500, method: 'bank_transfer', desc: 'Advance against PO', ref: 'DBN-2026-0088' }, { date: '2026-10-05', amount: 400, method: 'debit_card', desc: 'mada · terminal 2', ref: '' }],
    cashDisc: 0, comm: 0, commMethod: '', zatca: true, tab: 'products',
  };
}
function invCalc() {
  const v = S.inv, vp = v.vatPct / 100;
  const L = v.lines.map(l => { const net = Math.max(0, l.price - l.disc); return { inc: r2(l.price * (1 + vp)), pct: l.price ? r2(l.disc / l.price * 100) : 0, tEx: r2(net * l.qty), tInc: r2(net * l.qty * (1 + vp)), low: net < l.cost }; });
  const totEx = r2(L.reduce((a, x) => a + x.tEx, 0)), totInc = r2(L.reduce((a, x) => a + x.tInc, 0));
  const discEx = v.discMode === 'pct' ? r2((totEx + v.ship) * v.discVal / 100) : v.discMode === 'inc' ? r2(v.discVal / (1 + vp)) : r2(v.discVal);
  const taxable = r2(totEx + v.ship - discEx), vat = r2(taxable * vp), before = r2(taxable + vat);
  const round = v.roundAuto ? r2(Math.round(before) - before) : r2(v.roundVal);
  const net = r2(before + round), paid = r2(v.pays.reduce((a, p) => a + (+p.amount || 0), 0)), due = r2(net - paid);
  return { L, totEx, totInc, discEx, discInc: r2(discEx * (1 + vp)), taxable, vat, before, round, net, paid, due, status: paid <= 0 ? 'not_paid' : due <= 0.004 ? 'paid' : 'paid_partially' };
}

  'perm-all': el => { ['R', 'C', 'U', 'D'].forEach(op => { S.perm[`${ROLES[S.roleSel][0]}|${el.dataset.v}|${op}`] = el.checked; $(`#pm-${el.dataset.v}-${op}`).checked = el.checked; }); },
  // jobs
  'job-menu': el => openMenu(el, `<div class="mh micro">Move ${el.dataset.v}</div>${KCOLS.map(c => `<button data-act="job-move" data-v="${el.dataset.v}" data-col="${c}">${ic('chev', 'ico-sm flip')}${c}</button>`).join('')}<hr><button data-act="go" data-v="sales-new">${ic('invoice')}Create sales invoice</button>`),
  'job-move': el => { moveJob(el.dataset.v, el.dataset.col); closeMenu(); },
  report: el => { const v = el.dataset.v; if (v.startsWith('Z')) zReport(); else if (v.startsWith('VAT')) document.querySelector('.vatbox').scrollIntoView({ behavior: 'smooth', block: 'center' }); else toast(`${v} report generated`, 'Q4 2026 · Riyadh HQ · opens in a new tab in the full product', 'ok'); },
};
function findPosItem(name) { return [...POS.rest, ...POS.cafe, ...POS.bakkala, ...POS.fish, ...POS.super].find(x => x.name === name) || (POS.labour.find(l => l[0] === name) ? { name, price: POS.labour.find(l => l[0] === name)[2] } : null) || (D.products.find(p => p.name === name) ? { name, price: D.products.find(p => p.name === name).price * 1.15 } : null); }
function modTotal() { const b = $('[data-mods]'); if (!b) return; const size = $('#mod-size .on'); const ex = $$('[data-mods] input[data-price]:checked').reduce((a, x) => a + +x.dataset.price, 0); const q = $('#mod-q') ? +$('#mod-q').textContent : 1; $('#mod-total').textContent = 'SAR ' + fmt((+b.dataset.base + +size.dataset.v + ex) * q); }
function splitRows(n) { const c = cartCalc(), each = r2(c.total / n); return `<table class="tbl compact"><thead><tr><th>Guest</th><th class="num">Share</th><th>Tender</th></tr></thead><tbody>${Array.from({ length: n }, (_, i) => `<tr><td>Guest ${i + 1}</td><td class="num">${fmt(i === n - 1 ? c.total - each * (n - 1) : each)}</td><td><select class="select input-sm" id="split-t${i}"><option>Cash</option><option>mada</option><option>Credit card</option><option>STC Pay</option></select></td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="num">${fmt(c.total)}</td><td></td></tr></tfoot></table>`; }
function superScan(code) {
  let it = POS.super.find(x => x.bc === code);
  if (!it && /^2\d{12}$/.test(code)) { const plu = code.slice(2, 7), kg = +code.slice(7, 12) / 1000; it = { bc: code, name: `Scale item PLU ${plu} · ${kg.toFixed(3)} kg`, ar: '', price: r2(kg * 25) }; }
  if (!it) { toast('Invalid barcode', `${esc(code)} not found in catalogue`, 'bad'); return; }
  S.lastScan = it; posAdd(it.name, it.price, { qty: S.multiplier, promo: it.promo, sub: it.promo === 'b2g1' ? 'Buy 2 get 1' : undefined });
  const ln = S.cart.find(l => l.name === it.name); if (ln && it.promo) { ln.promo = it.promo; }
  const ls = $('.lastscan'); reLeft(); paintCart(); S.multiplier = 1;
}
function moveJob(no, col) { const j = S.jobs.find(x => x.no === no); if (!j || j.st === col) return; j.st = col; render(); toast(`${no} moved to ${col}`, col === 'Ready' ? 'Customer notified by SMS & WhatsApp' : '', 'ok'); }
function paintBulk() { const n = S.salesSel.size, b = $('#bulkbar'); if (!b) return; b.classList.toggle('hide', !n); const s = b.querySelector('b'); if (s) s.textContent = `${n} selected`; }
function paintStage() { const s = $('#ps-stage'); if (s) s.innerHTML = psPreview(); }
let checkTimer = null;
function runChecks() { clearInterval(checkTimer); checkTimer = setInterval(() => { if (S.zChecks >= 6 || S.route !== 'zatca') { clearInterval(checkTimer); if (S.zChecks >= 6) toast('All 6 compliance checks passed', 'You can now request the production CSID', 'ok'); return; } S.zChecks++; if (S.zStep === 4) render(); }, 520); }
function emailTest() {
  const to = ($('#et-to') || {}).value || 'test@example.com', p = PROVS.find(x => x[0] === S.prov);
  const host = p[4] === 'smtp' ? (S.prov === 'zoho' ? 'smtppro.zoho.sa' : 'mail.alnoor.sa') : p[4] === 'oauth' ? (S.prov === 'gmail' ? 'gmail.googleapis.com' : 'graph.microsoft.com') : `api.${S.prov}.com`;
  const steps = [['DNS', `Resolved ${host} → ${p[4] === 'smtp' ? '185.70.42.12' : '142.250.74.10'}`], ['Connect', `${p[4] === 'smtp' ? 'TCP ' + (S.prov === 'zoho' ? 465 : 587) : 'HTTPS 443'} connected (38 ms)`], ['TLS', p[4] === 'smtp' && S.prov !== 'zoho' ? 'STARTTLS negotiated · TLS 1.3 · AES_256_GCM' : 'TLS 1.3 · certificate valid'], ['Auth', p[4] === 'oauth' ? 'OAuth bearer token accepted' : p[4] === 'api' ? 'API key accepted (scope: mail.send)' : 'AUTH LOGIN 235 2.7.0 accepted'], ['Send', `250 2.0.0 queued as ${hex(to, 10).toUpperCase()}`], ['Delivered', `${esc(to)} · inbox (spam score 0.4)`]];
  S.emailLog = []; const log = $('#email-log'); log.innerHTML = '';
  steps.forEach((s, i) => setTimeout(() => { const ln = `<div class="ln"><span class="tm">10:14:${String(2 + i * 1).padStart(2, '0')}</span><b style="min-width:76px">${s[0]}</b><span>${s[1]}</span><span class="st ok">✓</span></div>`; S.emailLog.push(ln); const l = $('#email-log'); if (l) l.insertAdjacentHTML('beforeend', ln); if (i === steps.length - 1) toast('Test email delivered', esc(to), 'ok'); }, 380 * (i + 1)));
}

/* ---------- input / change / key / drag ---------- */
const IN = {
  pw: el => { S.pw = el.value; const s = pwScore(S.pw); $('#pw-meter').className = 'strength s' + s; $('#pw-lbl').textContent = ['Use 8+ characters with a mix of letters, numbers & symbols', 'Weak', 'Fair', 'Good', 'Strong'][s]; },
  vat: el => { el.value = el.value.replace(/\D/g, ''); S.su.vat = el.value; const v = vatState(el.value), m = $('#vat-msg'); el.classList.toggle('is-bad', v[0] === 'bad'); el.classList.toggle('is-ok', v[0] === 'ok'); m.className = v[0] === 'bad' ? 'err' : v[0] === 'ok' ? 'okmsg' : 'hint'; m.textContent = v[1] || '15 digits, starts and ends with 3'; },
  'inv-vat': el => { el.value = el.value.replace(/\D/g, ''); S.inv.vat = el.value; const v = vatState(el.value), m = $('#inv-vat-msg'); el.classList.toggle('is-bad', v[0] === 'bad'); m.className = v[0] === 'bad' ? 'err' : v[0] === 'ok' ? 'okmsg' : 'hint'; m.textContent = v[1] || '15 digits · B2B invoices are cleared'; },
  'cu-vat': el => { el.value = el.value.replace(/\D/g, ''); const v = vatState(el.value), m = $('#cu-vat-msg'); el.classList.toggle('is-bad', v[0] === 'bad'); el.classList.toggle('is-ok', v[0] === 'ok'); m.className = v[0] === 'bad' ? 'err' : v[0] === 'ok' ? 'okmsg' : 'hint'; m.textContent = v[1] || '15 digits'; },
  otp: el => { el.value = el.value.replace(/\D/g, '').slice(0, 1); const i = +el.dataset.i; if (el.value && i < 5) $('#otp-' + (i + 1)).focus(); if (i === 5 && el.value) toast('Code verified', '', 'ok'); },
  cmdk: el => { cmdSel = 0; renderCmd(el.value); },
  'sales-f': el => { S.salesFilters[el.dataset.k] = el.value; $('#sales-body').innerHTML = salesTbody(); $('#sales-count').textContent = `${salesRows().length} of 1,284 · filtered`; ['sf-q', 'sf-code'].forEach(id => { const o = $('#' + id); if (o && o !== el && el.dataset.k === 'code') o.value = el.value; }); },
  'cust-q': el => { S.inv.custQ = el.value; custTA(el.value); },
  'prod-q': el => prodTA(el.value),
  line: el => { const l = S.inv.lines[+el.dataset.i], k = el.dataset.k, n = parseFloat(String(el.value).replace(/,/g, '')) || 0, vp = S.inv.vatPct / 100;
    if (k === 'name' || k === 'from') { l[k] = el.value; return; }
    if (k === 'inc') { l.price = r2(n / (1 + vp)); const p = $(`#l${el.dataset.i}-price`); if (p) p.value = fmt(l.price); }
    else if (k === 'pct') { l.disc = r2(l.price * n / 100); const d = $(`#l${el.dataset.i}-disc`); if (d) d.value = fmt(l.disc); }
    else l[k] = n;
    invPaint(); },
  pay: el => { const p = S.inv.pays[+el.dataset.i]; p[el.dataset.k] = el.dataset.k === 'amount' ? parseFloat(el.value.replace(/,/g, '')) || 0 : el.value; invPaint(); },
  sum: el => { const k = el.dataset.k; if (k === 'roundAuto') { S.inv.roundAuto = el.checked; $('#s-round').readOnly = el.checked; } else S.inv[k] = parseFloat(el.value.replace(/,/g, '')) || 0; invPaint(); },
  invf: el => { S.inv[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; },
  'pos-search': el => { const q = el.value.toLowerCase(); $$('#pos-tiles .tile').forEach(tl => tl.classList.toggle('hide', !!q && !tl.dataset.search.includes(q))); },
  'lbl-qty': el => { S.lblQty[el.dataset.i] = Math.max(0, parseInt(el.value) || 0); clearTimeout(IN._lt); IN._lt = setTimeout(() => { const f = document.activeElement && document.activeElement.id; render(); if (f) { const e = document.getElementById(f); if (e) { e.focus(); e.setSelectionRange && e.setSelectionRange(e.value.length, e.value.length); } } }, 450); },
  'lbl-stock': el => { S.labelStock = el.value; render(); },
  paper: el => { S.paper = el.value; render(); },
  'ps-num': el => { S.ps[el.dataset.k] = parseFloat(el.value) || 0; paintStage(); },
  'ps-font': el => { S.ps.font = el.value; paintStage(); },
  serial: () => { const p = $('#sn-prefix').value, pad = +$('#sn-pad').value || 1, st = +$('#sn-start').value || 1, m = $('#sn-monthly').checked; $('#sn-preview').textContent = `${p}${m ? '20261005-' : ''}${String(st + 142).padStart(pad, '0')}`; },
  gq: el => { const q = el.value.toLowerCase(); $$('#g-body tr').forEach(r => r.classList.toggle('hide', !!q && !r.textContent.toLowerCase().includes(q))); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (menuEl && !e.target.closest('.menu') && !(el && ['store-menu', 'bell', 'user-menu', 'proto', 'row-menu', 'import-menu', 'line-info', 'stock-pop', 'pos-cust', 'pos-disc', 'pos-recall', 'job-menu', 'more-simple', 'simple-menu', 'view-more'].includes(el.dataset.act))) closeMenu();
  if (!e.target.closest('.ta')) { ['#cust-ta', '#prod-ta'].forEach(s => { const x = $(s); if (x) x.innerHTML = ''; }); }
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'mask') { if (e.target === el) closeLayer(); return; }
  if (el.tagName === 'A' && ['drawer', 'scrollto', 'vert-go', 'su-step', 'login-step'].includes(act)) e.preventDefault();
  if (el.tagName === 'A' && act === 'toast') e.preventDefault();
  if (el.closest('.menu') && !['lang', 'theme', 'cmdk'].includes(act)) { /* keep */ }
  const fn = A[act]; if (fn) { if (el.closest('.menu') && ['lang', 'theme', 'cmdk', 'go', 'toast'].includes(act)) closeMenu(); fn(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); if (e.target.dataset && e.target.dataset.su) S.su[e.target.dataset.su] = e.target.value; });
document.addEventListener('focusin', e => { if (e.target.id === 'inv-cust') custTA(e.target.value === S.inv.cust?.name ? '' : e.target.value); if (e.target.id === 'inv-prod') prodTA(e.target.value); });
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.actChange; if (!k) return;
  if (k === 'rcpt') readReceipt(el.files[0]);
  if (k === 'img-up' || k === 'cu-img') { const files = [...el.files]; files.forEach(f => { if (k === 'img-up' && f.type.startsWith('image/')) { const rd = new FileReader(); rd.onload = () => { $('#img-grid').insertAdjacentHTML('afterbegin', `<div style="aspect-ratio:1;border-radius:var(--r);border:1px solid var(--border);background:url(${rd.result}) center/cover;display:flex;align-items:flex-end;padding:6px"><span class="pill ok" style="height:18px">${esc(f.name.slice(0, 14))}</span></div>`); }; rd.readAsDataURL(f); } else if (k === 'cu-img') $('#cu-img-list').insertAdjacentHTML('beforeend', `<div class="filecard">${ic('file')}<span class="grow ellip">${esc(f.name)}</span><span class="hint">${(f.size / 1024).toFixed(0)} KB</span></div>`); }); toast(`${files.length} file${files.length > 1 ? 's' : ''} uploaded`, '', 'ok'); }
  if (k === 'datemode') { const single = el.value === 'Single date'; $('#sf-to').classList.toggle('hide', single); el.nextElementSibling.nextElementSibling.classList.toggle('hide', single); }
});
function readReceipt(f) {
  if (!f) return; const size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB';
  const done = url => { S.receipt = { name: f.name, size, type: f.type || 'file', url, pdf: /pdf/.test(f.type) }; $('#rcpt-card').innerHTML = receiptCard(S.receipt); $('#rcpt-submit').disabled = false; };
  if (f.type.startsWith('image/')) { const rd = new FileReader(); rd.onload = () => done(rd.result); rd.readAsDataURL(f); } else done(null);
}
document.addEventListener('dragover', e => { const z = e.target.closest('#dropzone, .kcol'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest('#dropzone'); if (z) z.classList.remove('over'); });
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard'); if (c) e.dataTransfer.setData('text/plain', c.dataset.job); });
document.addEventListener('drop', e => {
  const z = e.target.closest('#dropzone'); if (z) { e.preventDefault(); z.classList.remove('over'); readReceipt(e.dataTransfer.files[0]); return; }
  const col = e.target.closest('.kcol'); if (col) { e.preventDefault(); const no = e.dataTransfer.getData('text/plain'); if (no) moveJob(no, col.dataset.col); }
});
document.addEventListener('keydown', e => {
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && k.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); return; }
  if (k === 'Escape') { if (menuEl) closeMenu(); else if ($('#layer').innerHTML) closeLayer(); else if (S.drawer) A.drawer(); return; }
  if (e.target.id === 'cmdk-q') {
    const items = $$('#cmdk-res .it');
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel + (k === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length); renderCmd(e.target.value); }
    if (k === 'Enter' && items[cmdSel]) { e.preventDefault(); A['cmd-go'](items[cmdSel]); }
    return;
  }
  const dk = e.target.dataset && e.target.dataset.key;
  if (k === 'Enter' && dk === 'scan') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; if (addLine(v)) { toast('Line added', v, 'ok'); e.target.value = ''; } else { toast('Invalid barcode', `${esc(v)} — no product found`, 'bad'); e.target.select(); } return; }
  if (k === 'Enter' && dk === 'pos-scan') { e.preventDefault(); const v = e.target.value.trim(); e.target.value = ''; if (v) superScan(v); setTimeout(() => $('#pos-scan') && $('#pos-scan').focus(), 10); return; }
  if (k === 'Enter' && dk === 'pricecheck') { e.preventDefault(); const v = e.target.value.trim(), p = D.products.find(x => x.bc === v || x.pn.toLowerCase() === v.toLowerCase()) || POS.super.find(x => x.bc === v); $('#pc-res').innerHTML = p ? `<div class="lastscan"><div class="grow"><b style="font-size:16px">${esc(p.name)}</b><div class="hint mono">${p.pn || p.bc}${p.st ? ' · stock ' + (p.st[0] + p.st[1] + p.st[2]) + ' · rack ' + p.rack : ''}</div></div><b style="font-size:22px" class="tnum">SAR ${fmt(p.st ? p.price * 1.15 : p.price)}</b></div>` : `<div class="banner bad">${ic('alert')}<div>No product for <b class="mono">${esc(v)}</b></div></div>`; return; }
  if (S.route === 'sales-new' && S.inv) {
    if (k === 'F2') { e.preventDefault(); $('#inv-prod').focus(); }
    else if (k === 'F4') { e.preventDefault(); $('#inv-cust').focus(); }
    else if (k === 'F8') { e.preventDefault(); A['pay-add'](); const n = S.inv.pays.length - 1; setTimeout(() => $(`#p${n}-amt`) && $(`#p${n}-amt`).focus(), 10); }
    else if (mod && k.toLowerCase() === 's') { e.preventDefault(); A['inv-create'](); }
    else if (mod && k.toLowerCase() === 'p') { e.preventDefault(); printJob('Sales invoice (80mm)'); }
  }
  if ((k === 'Enter' || k === ' ') && e.target.matches('.prn,.kcard') && !e.target.matches('input')) { e.preventDefault(); e.target.click(); }
});

/* ---------- boot ---------- */
S.cart = sampleCart('spare');
S.route = (location.hash.slice(1) || 'home').replace(/[^\w-]/g, '');
if (!Screens[S.route] && !G[S.route] && !PUBLIC.has(S.route)) S.route = 'home';
document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
render();
</script>
